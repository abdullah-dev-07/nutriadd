<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0072BC" />
    <title>NutriAdd — Life Care | Caring for Healthy Life</title>
    <meta
      name="description"
      content="NutriAdd (Life Care) is a Lahore-based pharmaceutical, nutraceutical, cosmeceutical and food-supplement company offering marketing, franchising, trading and consultancy across Pakistan."
    />
    <!-- Static fallback SEO defaults (per-page values are set at runtime by the
         <Seo> component). Canonical domain: https://nutriadd.store -->
    <link rel="canonical" href="https://nutriadd.store/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NutriAdd — Life Care" />
    <meta
      property="og:title"
      content="NutriAdd — Life Care | Caring for Healthy Life"
    />
    <meta
      property="og:description"
      content="Science-backed pharmaceutical and nutraceutical supplements from NutriAdd (Life Care) — delivered across Pakistan."
    />
    <meta property="og:url" content="https://nutriadd.store/" />
    <meta property="og:image" content="https://nutriadd.store/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nutriadd.store/og-image.png" />
  </head>
  <body>
    <script>
      // Apply saved/OS theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('nutriadd_theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
