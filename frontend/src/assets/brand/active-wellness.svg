<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A man and a woman running actively">
  <defs>
    <linearGradient id="aw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF7EF"/>
      <stop offset="100%" stop-color="#E7F1FB"/>
    </linearGradient>
    <linearGradient id="aw-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28C267"/>
      <stop offset="100%" stop-color="#0E5EA8"/>
    </linearGradient>
    <linearGradient id="aw-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28C267"/>
      <stop offset="100%" stop-color="#0E8A5E"/>
    </linearGradient>
    <linearGradient id="aw-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1785C9"/>
      <stop offset="100%" stop-color="#0E5EA8"/>
    </linearGradient>
    <filter id="aw-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E5EA8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Soft rounded backdrop -->
  <rect x="20" y="20" width="600" height="480" rx="48" fill="url(#aw-bg)"/>

  <!-- Decorative energy rings -->
  <circle cx="320" cy="270" r="210" fill="none" stroke="#28C267" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="4 12"/>
  <circle cx="320" cy="270" r="168" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- Ground line -->
  <path d="M120 400 h400" stroke="#CFE3F0" stroke-width="4" stroke-linecap="round"/>

  <!-- ===================== WOMAN (green, leading) ===================== -->
  <g filter="url(#aw-shadow)" transform="translate(232,196)">
    <!-- ponytail -->
    <path d="M22 6 C40 -2 46 12 40 26 C34 20 28 18 22 20 Z" fill="url(#aw-green)"/>
    <!-- head -->
    <circle cx="18" cy="14" r="17" fill="url(#aw-green)"/>
    <!-- torso leaning forward -->
    <path d="M6 30 C22 24 40 30 44 48 L30 92 C24 96 12 94 8 86 L2 50 C0 42 0 34 6 30 Z" fill="url(#aw-green)"/>
    <!-- forward (bent) arm -->
    <path d="M40 44 C56 40 66 52 60 66 C54 62 48 60 42 62 Z" fill="url(#aw-green)"/>
    <!-- back arm swinging -->
    <path d="M10 46 C-6 50 -16 40 -10 28 C-4 34 2 36 8 34 Z" fill="url(#aw-green)"/>
    <!-- front leg driving up -->
    <path d="M24 90 C40 98 52 116 44 140 C36 136 28 132 24 124 L16 104 Z" fill="url(#aw-blue)"/>
    <!-- back leg extended -->
    <path d="M14 92 C4 112 -12 128 -30 132 C-34 124 -32 116 -24 112 L4 92 Z" fill="url(#aw-blue)"/>
    <!-- shoes -->
    <path d="M44 136 h22 c6 0 8 8 2 10 l-24 2 z" fill="#0E5EA8"/>
    <path d="M-32 128 l-18 8 c-6 3 -2 11 4 10 l22 -6 z" fill="#0E5EA8"/>
  </g>

  <!-- ===================== MAN (blue, following) ===================== -->
  <g filter="url(#aw-shadow)" transform="translate(360,206)">
    <!-- head -->
    <circle cx="30" cy="14" r="18" fill="url(#aw-blue)"/>
    <!-- torso -->
    <path d="M16 32 C34 26 54 32 58 52 L44 98 C38 102 24 100 20 92 L12 54 C10 44 10 38 16 32 Z" fill="url(#aw-blue)"/>
    <!-- forward arm -->
    <path d="M54 48 C72 44 82 58 74 72 C68 66 60 64 54 66 Z" fill="url(#aw-blue)"/>
    <!-- back arm -->
    <path d="M18 50 C0 54 -12 44 -6 30 C0 36 8 38 16 36 Z" fill="url(#aw-blue)"/>
    <!-- front leg -->
    <path d="M36 96 C54 104 66 124 56 150 C48 146 40 142 36 132 L28 110 Z" fill="url(#aw-green)"/>
    <!-- back leg -->
    <path d="M22 98 C10 120 -8 138 -28 142 C-32 134 -28 126 -20 122 L10 98 Z" fill="url(#aw-green)"/>
    <!-- shoes -->
    <path d="M54 146 h24 c6 0 8 8 2 10 l-26 2 z" fill="#0E8A5E"/>
    <path d="M-30 138 l-20 8 c-6 3 -2 11 4 10 l24 -6 z" fill="#0E8A5E"/>
  </g>

  <!-- Motion / speed streaks -->
  <g stroke-linecap="round" opacity="0.8">
    <path d="M150 250 h70" stroke="#28C267" stroke-width="6"/>
    <path d="M140 288 h50" stroke="#1785C9" stroke-width="6"/>
    <path d="M158 326 h64" stroke="#28C267" stroke-width="6"/>
  </g>

  <!-- Wellness spark -->
  <g transform="translate(470,150)">
    <circle r="26" fill="url(#aw-brand)"/>
    <path d="M-3 -12 h6 v9 h9 v6 h-9 v9 h-6 v-9 h-9 v-6 h9 z" fill="#FFFFFF"/>
  </g>
</svg>
