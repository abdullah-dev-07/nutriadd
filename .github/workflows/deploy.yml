name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to NutriAdd Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd ~/nutriadd

            echo "Pulling latest code....."
            git pull origin main

            cd backend

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Installing dependencies..."
            pip install -r requirements.txt

            echo "Running database migrations..."
            alembic upgrade head

            echo "Restarting FastAPI..."
            sudo -n /usr/bin/systemctl restart nutriadd-backend

            echo "Checking service..."
            sudo -n /usr/bin/systemctl is-active --quiet nutriadd-backend

            echo "Waiting for API..."
            sleep 3

            echo "Checking local API health..."
            curl -f http://127.0.0.1:8000/health

            echo "Checking public API health..."
            curl -f https://api.nutriadd.store/health

            echo "Deployment successful!"